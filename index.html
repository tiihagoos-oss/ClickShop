
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClickShop | Loja Online</title>

<style>
:root {
  --pink: #f34e86;
  --ink: #252525;
  --muted: #777;
  --bg: #f7f7f8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
}

header {
  background: white;
  box-shadow: 0 2px 8px #0000000c;
  position: sticky;
  top: 0;
  z-index: 5;
}

.top {
  max-width: 1200px;
  margin: auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 24px;
}

.logo {
  font-size: 26px;
  font-weight: 800;
  color: var(--pink);
  white-space: nowrap;
  text-decoration: none;
}

.search {
  flex: 1;
  display: flex;
  background: #f2f2f2;
  border-radius: 7px;
  overflow: hidden;
}

.search input {
  border: 0;
  background: transparent;
  padding: 13px;
  width: 100%;
  outline: 0;
}

.search button {
  border: 0;
  background: var(--pink);
  color: white;
  padding: 0 20px;
  cursor: pointer;
}

.cart {
  border: 0;
  background: none;
  font-size: 24px;
  cursor: pointer;
}

.nav {
  max-width: 1200px;
  margin: auto;
  padding: 0 20px 12px;
  display: flex;
  gap: 22px;
  color: #666;
  font-size: 13px;
}

main {
  max-width: 1200px;
  margin: 24px auto;
  padding: 0 20px;
}

.hero {
  background: linear-gradient(110deg, #ffe0eb, #fff4f7);
  border-radius: 12px;
  padding: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
}

.hero h1 {
  font-size: clamp(26px, 4vw, 42px);
  margin: 0 0 10px;
}

.hero p {
  color: #66535a;
  margin: 0 0 18px;
}

.cta {
  background: var(--pink);
  color: white;
  border: 0;
  padding: 12px 20px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.hero-art {
  font-size: 80px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0;
}

.toolbar h2 {
  margin: 0;
}

.toolbar select {
  padding: 9px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: white;
}

.products {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px #00000008;
  transition: transform 0.15s;
}

.card:hover {
  transform: translateY(-3px);
}

.photo {
  height: 220px;
  display: grid;
  place-items: center;
  background: #f4f1f2;
  font-size: 72px;
}

.info {
  padding: 14px;
}

.name {
  margin: 0 0 9px;
  min-height: 36px;
  line-height: 1.35;
}

.price {
  font-size: 20px;
  font-weight: 800;
  color: var(--pink);
}

.old {
  font-size: 12px;
  color: #999;
  text-decoration: line-through;
  margin-left: 7px;
}

.rating {
  font-size: 12px;
  color: #d58a20;
  margin: 8px 0;
}

.buy {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--pink);
  color: var(--pink);
  background: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.buy:hover {
  background: var(--pink);
  color: white;
}

footer {
  text-align: center;
  color: #888;
  padding: 36px 20px;
  margin-top: 30px;
}

@media (max-width: 850px) {
  .products {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .photo {
    height: 190px;
  }

  .nav {
    overflow: auto;
    white-space: nowrap;
  }
}

@media (max-width: 600px) {
  .top {
    gap: 10px;
    padding: 12px;
  }

  .logo {
    font-size: 20px;
  }

  .search button {
    padding: 0 12px;
  }

  .nav {
    padding: 0 12px 10px;
    gap: 15px;
  }

  main {
    padding: 0 12px;
    margin: 14px auto;
  }

  .hero {
    padding: 22px;
  }

  .hero-art {
    font-size: 52px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .photo {
    height: 160px;
    font-size: 58px;
  }

  .info {
    padding: 11px;
  }

  .name {
    font-size: 13px;
  }

  .price {
    font-size: 17px;
  }

  .toolbar {
    align-items: flex-start;
    gap: 10px;
  }

  .toolbar h2 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">

    <a class="logo" href="#">
      ClickShop<span style="color:#333">.</span>
    </a>

    <form class="search" id="searchForm">
      <input
        id="searchInput"
        placeholder="Buscar produtos..."
        aria-label="Buscar produtos"
      >

      <button>Buscar</button>
    </form>

    <button
      class="cart"
      aria-label="Carrinho"
      onclick="alert('Seu carrinho está vazio por enquanto.')"
    >
      🛒
    </button>

  </div>

  <nav class="nav">
    <span>Moda feminina</span>
    <span>Beleza</span>
    <span>Acessórios</span>
    <span>Casa</span>
    <span>Ofertas</span>
  </nav>
</header>

<main>

  <section class="hero">

    <div>
      <h1>Seu estilo, do seu jeito.</h1>

      <p>
        Descubra novidades e ofertas selecionadas para você.
      </p>

      <button
        class="cta"
        onclick="document.getElementById('produtos').scrollIntoView({behavior:'smooth'})"
      >
        Ver produtos
      </button>
    </div>

    <div class="hero-art" aria-hidden="true">
      🛍️
    </div>

  </section>

  <div class="toolbar">

    <h2 id="sectionTitle">
      Mais populares
    </h2>

    <select id="sort">
      <option value="default">Ordenar por</option>
      <option value="low">Menor preço</option>
      <option value="high">Maior preço</option>
    </select>

  </div>

  <section class="products" id="produtos"></section>

</main>

<footer>
  © 2026 ClickShop · Loja demonstrativa
</footer>

<script>

const items = [



  {
  name: "Bolsa Feminina Transversal Romantic Crown",
  price: 99.99,
  old: 129.90,
  emoji: "👜",
  image: "https://romanticcrown.com.br/cdn/shop/files/bolsa-feminina-transversal-bolsa-de-couro-feminina-alca-mala.jpg",
  link: "https://romanticcrown.com.br/products/bolsa-feminina-transversal-bolsa-de-couro-feminina-alca-mala",
  tag: "Acessórios"
},

  {
    name: "Tênis urbano confortável",
    price: 149.90,
    old: 199.90,
    emoji: "👟",
    tag: "Moda"
  },

  {
    name: "Óculos de sol moderno",
    price: 49.90,
    old: 79.90,
    emoji: "🕶️",
    tag: "Acessórios"
  },

  {
    name: "Kit cuidados com a pele",
    price: 69.90,
    old: 99.90,
    emoji: "🧴",
    tag: "Beleza"
  },

  {
    name: "Relógio minimalista",
    price: 119.90,
    old: 159.90,
    emoji: "⌚",
    tag: "Acessórios"
  },

  {
    name: "Blusa básica elegante",
    price: 59.90,
    old: 89.90,
    emoji: "👚",
    tag: "Moda"
  },

  {
    name: "Fone de ouvido sem fio",
    price: 99.90,
    old: 149.90,
    emoji: "🎧",
    tag: "Eletrônicos"
  },

  {
    name: "Caneca decorativa",
    price: 29.90,
    old: 39.90,
    emoji: "☕",
    tag: "Casa"
  }

];

const money = n =>
  n.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });

function render() {

  let q = document
    .getElementById("searchInput")
    .value.toLowerCase();

  let list = items.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.tag.toLowerCase().includes(q)
  );

  const sort = document.getElementById("sort").value;

  if (sort === "low") {
    list.sort((a, b) => a.price - b.price);
  }

  if (sort === "high") {
    list.sort((a, b) => b.price - a.price);
  }

  document.getElementById("sectionTitle").textContent =
    q ? `Resultados para "${q}"` : "Mais populares";

  document.getElementById("produtos").innerHTML =
    list.length
      ? list.map(p => `
        <article class="card">

          <div class="photo">
            ${p.emoji}
          </div>

          <div class="info">

            <p class="name">
              ${p.name}
            </p>

            <div>
              <span class="price">
                ${money(p.price)}
              </span>

              <span class="old">
                ${money(p.old)}
              </span>
            </div>

            <div class="rating">
              ★★★★★
              <span style="color:#888">
                (4,8)
              </span>
            </div>

            <button
              class="buy"
              onclick="alert('Produto demonstrativo: conecte seu checkout para finalizar a compra.')"
            >
              Adicionar ao carrinho
            </button>

          </div>

        </article>
      `).join("")
      : "<p>Nenhum produto encontrado.</p>";

}

document
  .getElementById("searchForm")
  .addEventListener("submit", e => {
    e.preventDefault();
    render();
  });

document
  .getElementById("sort")
  .addEventListener("change", render);

render();

</script>

</body>
</html>
